<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Webpages</title>
  <meta name="description" content="A personal collection of webpages I often refer to." />
  <style>
    :root {
      --bg: #0f0f14;
      --card: #171720;
      --text: #f4f4f6;
      --muted: #b8b8c2;
      --accent: #6cf2c2;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 50% -10%, #1f1f2e, var(--bg));
      display: grid;
      place-items: center;
    }
    .container {
      width: min(900px, 92vw);
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 8px;
      letter-spacing: 0.3px;
    }
    p {
      color: var(--muted);
      margin: 0 0 16px;
      font-size: 1.05rem;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .link {
      display: block;
      padding: 12px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .link:hover {
      transform: translateY(-1px);
      border-color: rgba(108,242,194,.5);
      background: rgba(108,242,194,.08);
    }
    footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: right;
    }
    code {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>My Webpages</h1>
      <p>
        I want to add webpages that I often refer to here. This is my personal
        launchpad for quick access to frequently used pages.
      </p>

      <div class="links">
        <!-- Add your links below -->
        <a class="link" href="/Webpages/hanuman-chalisa/"> Hanuman Chalisa</a>
        <a class="link" href="/Webpages/laxmi-narayan/">Lakshmi Narayan Mantra</a>
        <a class="link" href="/Webpages/ganesh-vandana/"> Ganesh Vandana</a>
        <!-- Example placeholders:
        <a class="link" href="https://example.com" target="_blank" rel="noopener">🔗 Useful Tool</a>
        <a class="link" href="/Webpages/notes/">📝 Notes</a>
        -->
      </div>

      <footer>
        <span>Hosted on GitHub Pages</span>
      </footer>
    </section>
  </main>
</body>
</html>
